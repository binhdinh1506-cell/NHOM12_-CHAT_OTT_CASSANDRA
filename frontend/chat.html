<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>OTT Chat NoSQL - High Performance Cassandra Engine</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'], },
              colors: { brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', } }
            }
          }
        }
    </script>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans h-screen flex overflow-hidden antialiased selection:bg-brand-500 selection:text-white relative">

<!-- Background Ambient Glows -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/15 rounded-full blur-[120px]"></div>
</div>

<div class="app relative z-10 flex w-full h-full backdrop-blur-sm">
    <!-- SIDEBAR -->
    <aside class="sidebar w-80 md:w-96 flex flex-col bg-slate-900/70 border-r border-slate-800/80 backdrop-blur-2xl">
        <div class="me p-4 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/40">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center font-bold text-white text-sm shadow-lg shadow-brand-500/20 shrink-0">
                    <i data-lucide="user" class="w-5 h-5 text-white"></i>
                </div>
                <div class="min-w-0">
                    <div class="me-name font-semibold text-sm text-white truncate" id="meName">...</div>
                    <div class="me-status text-[11px] font-mono text-emerald-400 flex items-center gap-1.5 mt-0.5" id="wsStatus">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>đang kết nối</span>
                    </div>
                </div>
            </div>
            <button id="btnLogout" class="link-btn p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-colors flex items-center gap-1 text-xs" type="button" title="Đăng xuất">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- CỤM NÚT: TẠO NHÓM & QUẢN LÝ BẠN BÈ -->
        <div class="p-3 flex gap-2">
            <button id="btnNewConv" class="primary flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-[13px] flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20 active:scale-95 transition" type="button">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Nhóm
            </button>
            <button id="btnManageFriends" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-[13px] flex items-center justify-center gap-2 active:scale-95 transition relative" type="button">
                <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i> Bạn bè
                <span id="sidebarReqBadge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] px-1.5 rounded-full hidden border border-slate-900">0</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-2 pb-2 custom-scrollbar">
            <ul id="convList" class="conv-list space-y-1"></ul>
        </div>
    </aside>

    <!-- CHAT WORKSPACE -->
    <main class="chat flex-1 flex flex-col bg-slate-950/40 relative">
        <header class="chat-header h-16 border-b border-slate-800/80 px-4 md:px-6 flex items-center justify-between bg-slate-900/50 backdrop-blur-xl shrink-0">
            <div class="flex items-center gap-2 md:gap-3 min-w-0">
                <button id="btnMobileBack" class="mobile-back-btn p-1.5 -ml-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition shrink-0" type="button">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-brand-500 shrink-0">
                    <i data-lucide="messages-square" class="w-4 h-4"></i>
                </div>
                <div id="chatTitle" class="chat-title font-bold text-sm text-white truncate">Chọn một cuộc hội thoại</div>
            </div>
            <div id="metrics" class="metrics flex items-center gap-2 text-xs font-mono text-slate-400"></div>
        </header>

        <div class="chat-body flex-1 overflow-y-auto p-4 md:p-6 space-y-4 custom-scrollbar relative flex flex-col">
            <div id="loadingOlder" class="loading-older hidden self-center sticky top-0 z-20 px-3.5 py-1.5 rounded-full bg-slate-800/90 border border-slate-700/80 shadow-xl backdrop-blur-md text-[11px] font-mono text-indigo-300 flex items-center gap-2">
                <div class="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                <span>Đang tải 20 tin nhắn cũ hơn...</span>
            </div>
            <div id="messages" class="messages flex flex-col space-y-3"></div>
        </div>

        <div class="composer p-3 md:p-4 border-t border-slate-800/80 bg-slate-900/60 backdrop-blur-xl shrink-0">
            <div class="max-w-5xl mx-auto flex items-center gap-2 md:gap-3">
                <div class="flex-1 relative flex items-center">
                    <input id="msgInput" type="text" placeholder="Nhập tin nhắn..." maxlength="2000" disabled class="w-full pl-4 pr-10 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500/80 focus:ring-1 focus:ring-brand-500/50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                </div>
                <button id="btnSend" class="primary px-4 md:px-5 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-sm flex items-center gap-2 shadow-lg shadow-brand-500/25 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none transition shrink-0" type="button" disabled>
                    <span class="hidden md:inline">Gửi</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>
</div>

<!-- [ĐÃ NÂNG CẤP] Modal Tạo Nhóm / Chat 1-1 -->
<dialog id="newConvDialog" class="rounded-2xl p-6 bg-slate-900 border border-slate-700/80 text-slate-100 shadow-2xl backdrop:backdrop-blur-md backdrop:bg-slate-950/70 max-w-md w-full m-auto">
    <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
            <i data-lucide="message-square-plus" class="w-5 h-5 text-brand-500"></i>
            <h3 class="font-bold text-base text-white">Tạo Cuộc Hội Thoại</h3>
        </div>
    </div>

    <div class="space-y-4">
        <!-- Tên Nhóm -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tên nhóm</label>
            <input id="newConvName" type="text" placeholder="Để trống nếu chat 1-1" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500">
        </div>

        <!-- Các thành viên đã chọn (Sẽ hiển thị dạng Tag/Badge) -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Thành viên đã chọn:</label>
            <div id="selectedMembersContainer" class="flex flex-wrap gap-2 min-h-[36px] p-2 bg-slate-950/50 border border-slate-800 rounded-xl">
                <!-- Javascript sẽ vẽ Badge vào đây -->
                <span class="text-xs text-slate-500 italic flex items-center">Chưa chọn ai...</span>
            </div>
        </div>

        <!-- Nhập UID thủ công -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Thêm bằng UID</label>
            <div class="flex gap-2">
                <input id="newConvUidInput" type="text" placeholder="Nhập UID (VD: EvanHoang#5023)" class="flex-1 px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs focus:border-brand-500 outline-none text-white">
                <button id="btnNewConvAddUid" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold transition border border-slate-700 shadow-sm flex items-center gap-1">
                    <i data-lucide="plus" class="w-3 h-3"></i> Thêm
                </button>
            </div>
            <div id="newConvAddError" class="text-[11px] text-rose-400 mt-1.5 hidden font-medium"></div>
        </div>

        <!-- Chọn từ danh sách Bạn bè -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Hoặc chọn từ Bạn bè:</label>
            <div id="newConvFriendList" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-1 bg-slate-950/40 p-2 rounded-xl border border-slate-800/60">
                <!-- Javascript sẽ vẽ Bạn bè vào đây -->
            </div>
        </div>

        <div id="newConvError" class="error text-xs text-rose-400 min-h-[16px] font-medium text-center"></div>
    </div>

    <div class="dialog-actions flex justify-end items-center gap-2.5 mt-5 pt-3 border-t border-slate-800">
        <button id="btnNewConvCancel" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">Hủy</button>
        <button id="btnNewConvOk" class="primary px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-semibold text-white shadow-md shadow-brand-500/20 active:scale-95 transition" type="button">Xác nhận tạo</button>
    </div>
</dialog>

<!-- Modal Chuyển tiếp tin nhắn -->
<dialog id="forwardDialog" class="rounded-2xl p-6 bg-slate-900 border border-slate-700/80 text-slate-100 shadow-2xl backdrop:backdrop-blur-md backdrop:bg-slate-950/70 max-w-sm w-full m-auto">
    <div class="flex items-center gap-2.5 mb-4 border-b border-slate-800 pb-3">
        <i data-lucide="share" class="w-5 h-5 text-brand-500"></i>
        <h3 class="font-bold text-base text-white">Chuyển tiếp tin nhắn</h3>
    </div>
    <div class="mb-3 text-xs text-slate-400">Chọn phòng muốn gửi:</div>
    <div id="forwardConvList" class="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar pr-1"></div>
    <div class="dialog-actions flex justify-end items-center mt-5 pt-3 border-t border-slate-800">
        <button id="btnForwardCancel" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">Hủy</button>
    </div>
</dialog>

<!-- Modal Quản lý Bạn Bè -->
<dialog id="friendDialog" class="rounded-2xl p-6 bg-slate-900 border border-slate-700/80 text-slate-100 shadow-2xl backdrop:backdrop-blur-md backdrop:bg-slate-950/70 max-w-md w-full m-auto">
    <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
            <i data-lucide="user-plus" class="w-5 h-5 text-emerald-400"></i>
            <h3 class="font-bold text-base text-white">Quản lý Bạn bè</h3>
        </div>
        <button id="btnCloseFriend" class="text-slate-400 hover:text-white transition rounded-lg p-1 hover:bg-slate-800">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- TABS -->
    <div class="flex gap-2 mb-4 border-b border-slate-800/80 pb-3">
        <button id="tabSearchFriend" class="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold bg-brand-600 text-white shadow-md transition">Tìm UID</button>
        <button id="tabFriendRequests" class="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold text-slate-400 hover:bg-slate-800 transition relative">
            Lời mời <span id="modalReqBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] px-1.5 rounded-full hidden">0</span>
        </button>
        <button id="tabFriendList" class="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold text-slate-400 hover:bg-slate-800 transition">Bạn bè</button>
    </div>

    <!-- PANE 1: TÌM UID -->
    <div id="paneSearchFriend" class="space-y-4">
        <div class="p-3 bg-slate-800/40 rounded-xl border border-slate-700/50 flex flex-col gap-1 text-center">
            <span class="text-xs text-slate-400">Mã kết bạn của bạn là:</span>
            <span id="myUidDisplay" class="text-sm font-mono text-emerald-400 font-bold bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 mx-auto select-all cursor-pointer" title="Click để copy">Đang tải...</span>
        </div>
        <div class="flex gap-2">
            <input id="searchUidInput" type="text" placeholder="Nhập UID bạn bè (VD: Bob#1234)" class="flex-1 px-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm focus:border-brand-500 outline-none text-white">
            <button id="btnSearchUid" class="px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-semibold transition shadow-md flex items-center gap-1">
                <i data-lucide="search" class="w-4 h-4"></i> Tìm
            </button>
        </div>
        <div id="searchResult" class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 hidden flex justify-between items-center transition-all">
        </div>
    </div>

    <!-- PANE 2: LỜI MỜI -->
    <div id="paneFriendRequests" class="hidden space-y-2 max-h-[280px] overflow-y-auto custom-scrollbar pr-1"></div>

    <!-- PANE 3: BẠN BÈ -->
    <div id="paneFriendList" class="hidden space-y-2 max-h-[280px] overflow-y-auto custom-scrollbar pr-1"></div>
</dialog>

<script src="js/auth.js"></script>
<script src="js/websocket.js"></script>
<script src="js/chat.js"></script>
<script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
