<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat OTT - Đăng nhập</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>💬 Chat OTT</h1>
    <p class="subtitle">Lưu trữ tin nhắn bằng Apache Cassandra</p>

    <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Đăng nhập</button>
        <button id="tabRegister" class="tab" type="button">Đăng ký</button>
    </div>

    <div id="authForm">
        <input id="username" type="text" placeholder="Tên đăng nhập" autocomplete="username">
        <input id="displayName" type="text" placeholder="Tên hiển thị" class="hidden">
        <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
        <button id="btnSubmit" class="primary" type="button">Đăng nhập</button>
        <div id="authError" class="error"></div>
    </div>

    <p class="hint-box">
        Tài khoản mẫu: <b>alice</b>, <b>bob</b>, <b>charlie</b>, <b>diana</b>, <b>evan</b><br>
        Mật khẩu: <b>123456</b>
    </p>
</div>
<script src="js/auth.js"></script>
</body>
</html>
